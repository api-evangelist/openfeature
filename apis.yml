type: Index
apis:
- aid: openfeature:openfeature-spec
  name: OpenFeature Evaluation API
  description: The OpenFeature specification defines a standard API for feature flag evaluation across languages. It includes
    the Evaluation API for resolving flag values with context, the Provider API for connecting to feature flag backends, the
    Hook API for intercepting evaluation lifecycle events, and the Event API for reacting to flag configuration changes. Providers
    can be implemented for any feature flag service.
  humanURL: https://openfeature.dev/docs/reference/intro
